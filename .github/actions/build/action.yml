name: Build Rekindled
description: Set up tools and run the repository build entry point
inputs:
  preset:
    description: Native CMake configure/build/test preset
    required: true
  configuration:
    description: Build configuration
    default: Release
  component:
    description: All, Native, or Managed
    default: All
  test:
    description: Run native and managed tests after building
    default: "true"
  compiler-cache:
    description: Cache native compilation (disable for traced CodeQL builds)
    default: "true"
runs:
  using: composite
  steps:
    - name: Setup .NET SDK
      if: inputs.component != 'Native'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: "10.0.x"

    - name: Install native dependencies (Linux)
      if: runner.os == 'Linux' && inputs.component != 'Managed'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build libssl-dev zlib1g-dev libsqlite3-dev pkg-config uuid-dev ccache

    - name: Setup MSVC environment (Windows)
      if: runner.os == 'Windows' && inputs.component != 'Managed'
      shell: pwsh
      run: ./tools/setup-msvc.ps1

    - name: Configure compiler cache location
      if: inputs.component != 'Managed' && inputs.compiler-cache == 'true'
      shell: pwsh
      run: |
        $cacheDir = Join-Path $env:RUNNER_TEMP 'compiler-cache'
        New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
        "CCACHE_DIR=$cacheDir" >> $env:GITHUB_ENV
        "SCCACHE_DIR=$cacheDir" >> $env:GITHUB_ENV
        "CCACHE_MAXSIZE=2G" >> $env:GITHUB_ENV
        "SCCACHE_CACHE_SIZE=2G" >> $env:GITHUB_ENV

    - name: Restore compiler cache
      if: inputs.component != 'Managed' && inputs.compiler-cache == 'true'
      id: compiler-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/compiler-cache
        key: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-compiler-v3-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-compiler-v3-

    - name: Install sccache (Windows)
      if: runner.os == 'Windows' && inputs.component != 'Managed' && inputs.compiler-cache == 'true'
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.18.0

    - name: Cache NuGet packages
      if: inputs.component != 'Native'
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-ci-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json', '**/NuGet.Config', '**/nuget.config', '**/global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-ci-

    - name: Bootstrap vcpkg
      if: runner.os == 'Windows' && inputs.component != 'Managed'
      uses: lukka/run-vcpkg@v11

    # run-vcpkg exports the removed x-gha backend. Override it after bootstrap.
    - name: Configure vcpkg binary cache
      if: runner.os == 'Windows' && inputs.component != 'Managed'
      shell: pwsh
      run: |
        $cacheDir = Join-Path $env:RUNNER_TEMP 'vcpkg-archives'
        New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
        "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite" >> $env:GITHUB_ENV

    - name: Restore vcpkg binary cache
      if: runner.os == 'Windows' && inputs.component != 'Managed'
      id: vcpkg-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/vcpkg-archives
        key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-v2-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-vcpkg-v2-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-
          ${{ runner.os }}-${{ runner.arch }}-vcpkg-v2-

    - name: Install vcpkg dependencies
      if: runner.os == 'Windows' && inputs.component != 'Managed'
      shell: pwsh
      run: |
        # Always validate the manifest and ABI, even when a cache was restored.
        & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet x64-windows --x-install-root="$env:GITHUB_WORKSPACE/vcpkg_installed"
        if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed: $LASTEXITCODE" }

    # Preserve dependency builds even if a later compile or test fails.
    - name: Save vcpkg binary cache
      if: runner.os == 'Windows' && inputs.component != 'Managed' && steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/vcpkg-archives
        key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

    - name: Build and test
      shell: pwsh
      env:
        BUILD_PRESET: ${{ inputs.preset }}
        BUILD_CONFIGURATION: ${{ inputs.configuration }}
        BUILD_COMPONENT: ${{ inputs.component }}
        BUILD_TEST: ${{ inputs.test }}
        BUILD_COMPILER_CACHE: ${{ inputs.compiler-cache }}
      run: |
        $cmakeArgs = @()
        if ($env:BUILD_COMPONENT -ne 'Managed') {
            $launcher = ''
            if ($env:BUILD_COMPILER_CACHE -eq 'true') {
                $launcher = if ($IsWindows) { $env:SCCACHE_PATH } else { (Get-Command ccache -ErrorAction Stop).Source }
                if (-not $launcher) { throw 'Compiler cache executable was not configured.' }
            }
            # Keep paths containing spaces as individual arguments.
            # Empty values also clear launchers in restored CodeQL build trees.
            $cmakeArgs = @("-DCMAKE_C_COMPILER_LAUNCHER=$launcher", "-DCMAKE_CXX_COMPILER_LAUNCHER=$launcher")
        }
        ./tools/build.ps1 -Preset $env:BUILD_PRESET -Configuration $env:BUILD_CONFIGURATION -Component $env:BUILD_COMPONENT -Test:($env:BUILD_TEST -eq 'true') -CMakeArgs $cmakeArgs

    - name: Compiler cache statistics
      if: always() && inputs.component != 'Managed' && inputs.compiler-cache == 'true'
      shell: pwsh
      run: |
        if ($IsWindows -and $env:SCCACHE_PATH) {
            & $env:SCCACHE_PATH --show-stats
        } elseif (Get-Command ccache -ErrorAction SilentlyContinue) {
            ccache --show-stats
        }

    - name: Save compiler cache
      if: always() && !cancelled() && inputs.component != 'Managed' && inputs.compiler-cache == 'true' && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/compiler-cache
        key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
