name: SonarQube analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name that triggered analysis from upstream workflow"
        required: false
        default: "main"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  sonar-loader:
    name: SonarQube Loader (C#)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-sonarqube-${{ hashFiles('Source/Loader/**/*.csproj', 'Source/Loader.Avalonia/**/*.csproj', '**/Directory.Packages.props', '**/global.json', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-sonarqube-

      - name: Cache SonarQube scanner plugins
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-plugin-cache-loader-v1
          restore-keys: |
            ${{ runner.os }}-sonar-plugin-cache-loader-

      - name: Cache SonarScanner for .NET tool
        id: cache-sonarscanner-tool
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dotnet-sonarscanner
          key: ${{ runner.os }}-dotnet-sonarscanner-11.3.0-v2

      - name: Validate SonarQube settings
        shell: bash
        run: |
          [[ -n "$SONAR_HOST_URL" ]] || { echo "SONAR_HOST_URL is not set"; exit 1; }
          [[ -n "$SONAR_TOKEN" ]] || { echo "SONAR_TOKEN is not set"; exit 1; }

      - name: Restore Loader projects
        run: |
          dotnet restore Source/Loader/Loader.csproj -p:Configuration=Release -p:EnableWindowsTargeting=true
          dotnet restore Source/Loader/Tests/Loader.Tests.csproj -p:Configuration=Release -p:EnableWindowsTargeting=true
          dotnet restore Source/Loader.Avalonia/Loader.Avalonia.csproj -p:Configuration=Release
          dotnet restore Source/Loader.Avalonia/Tests/Loader.Avalonia.Tests.csproj -p:Configuration=Release

      - name: Install SonarScanner for .NET
        shell: pwsh
        run: |
          $scannerDir = Join-Path $env:RUNNER_TEMP 'dotnet-sonarscanner'
          $scannerExe = Join-Path $scannerDir 'dotnet-sonarscanner.exe'
          if (-not (Test-Path -LiteralPath $scannerExe)) {
            dotnet tool update dotnet-sonarscanner --version 11.3.0 --tool-path $scannerDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path -LiteralPath $scannerExe)) {
            throw "SonarScanner executable was not installed at $scannerExe"
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $scannerDir

      - name: Verify SonarScanner is on PATH
        shell: pwsh
        run: Get-Command dotnet-sonarscanner -ErrorAction Stop

      - name: Run SonarScanner (Loader C#)
        id: scan_loader
        continue-on-error: true
        shell: bash
        env:
          # Preserve SonarScanner /k:, /d: and MSBuild /p: arguments on Windows.
          MSYS_NO_PATHCONV: '1'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/TestResults/Loader"
          dotnet sonarscanner begin \
            /k:"Rekindled-Server-Loader" \
            /n:"rekindled-server-loader" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.login="$SONAR_TOKEN" \
            /d:sonar.sources="Source/Loader" \
            /d:sonar.cs.opencover.reportsPaths="$GITHUB_WORKSPACE/TestResults/Loader/coverage.opencover.xml" \
            /d:sonar.sourceEncoding="UTF-8" \
            /d:sonar.qualitygate.wait="true"
          dotnet build Source/Loader/Loader.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true
          dotnet build Source/Loader/Tests/Loader.Tests.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true
          dotnet test Source/Loader/Tests/Loader.Tests.csproj --configuration Release --no-build --no-restore --blame-hang-timeout 2m --blame-hang-dump-type none -p:EnableWindowsTargeting=true /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput="$GITHUB_WORKSPACE/TestResults/Loader/coverage"
          test -s "$GITHUB_WORKSPACE/TestResults/Loader/coverage.opencover.xml" || { echo "OpenCover report is missing or empty"; exit 1; }
          dotnet sonarscanner end /d:sonar.login="$SONAR_TOKEN"

      - name: Run SonarScanner (Loader Avalonia C#)
        id: scan_loader_avalonia
        continue-on-error: true
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/TestResults/Loader.Avalonia"
          dotnet sonarscanner begin \
            /k:"Rekindled-Server-Loader-Avalonia" \
            /n:"rekindled-server-loader-avalonia" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.login="$SONAR_TOKEN" \
            /d:sonar.sources="Source/Loader.Avalonia" \
            /d:sonar.cs.opencover.reportsPaths="$GITHUB_WORKSPACE/TestResults/Loader.Avalonia/coverage.opencover.xml" \
            /d:sonar.sourceEncoding="UTF-8" \
            /d:sonar.qualitygate.wait="true"
          dotnet build Source/Loader.Avalonia/Loader.Avalonia.csproj --configuration Release --no-restore
          dotnet build Source/Loader.Avalonia/Tests/Loader.Avalonia.Tests.csproj --configuration Release --no-restore
          dotnet test Source/Loader.Avalonia/Tests/Loader.Avalonia.Tests.csproj --configuration Release --no-build --no-restore --blame-hang-timeout 2m --blame-hang-dump-type none /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput="$GITHUB_WORKSPACE/TestResults/Loader.Avalonia/coverage"
          test -s "$GITHUB_WORKSPACE/TestResults/Loader.Avalonia/coverage.opencover.xml" || { echo "OpenCover report is missing or empty"; exit 1; }
          dotnet sonarscanner end /d:sonar.login="$SONAR_TOKEN"

      - name: Fail job if any Loader Sonar scan failed
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.scan_loader.outcome }}" != "success" || "${{ steps.scan_loader_avalonia.outcome }}" != "success" ]]; then
            echo "One or more Loader Sonar scans failed (or quality gate failed)."
            echo "scan_loader outcome: ${{ steps.scan_loader.outcome }}"
            echo "scan_loader_avalonia outcome: ${{ steps.scan_loader_avalonia.outcome }}"
            exit 1
          fi

  sonar-server:
    name: SonarQube Server (C++)
    runs-on: ubuntu-latest
    steps:
      - name: Validate SonarQube settings
        shell: bash
        run: |
          [[ -n "$SONAR_TOKEN" ]] || { echo "SONAR_TOKEN is not set"; exit 1; }
          [[ -n "$SONAR_HOST_URL" ]] || { echo "SONAR_HOST_URL is not set"; exit 1; }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config libsqlite3-dev libssl-dev uuid-dev python3-venv

      - name: Install coverage tools
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/gcovr"
          "$RUNNER_TEMP/gcovr/bin/python" -m pip install 'gcovr==8.6'
          "$RUNNER_TEMP/gcovr/bin/gcovr" --version

      - name: Cache SonarQube scanner plugins
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-plugin-cache-${{ runner.os }}-v1
          restore-keys: sonar-plugin-cache-${{ runner.os }}-

      - name: Configure CMake (generates compile_commands.json)
        run: cmake --preset linux-debug -DCMAKE_C_FLAGS="--coverage -O0 -g" -DCMAKE_CXX_FLAGS="--coverage -O0 -g"

      - name: Build C++ targets with coverage instrumentation
        run: cmake --build --preset linux-debug --parallel "$(nproc)"

      - name: Run C++ tests
        run: ctest --preset linux-debug

      - name: Generate C++ Cobertura coverage report (sonar-cxx)
        shell: bash
        run: >-
          "$RUNNER_TEMP/gcovr/bin/gcovr"
          --root .
          --xml --output intermediate/cmake/linux-debug/cpp-cobertura.xml
          --exclude 'Source/ThirdParty/.*'
          --exclude 'intermediate/.*'
          intermediate/cmake/linux-debug

      - uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.projectKey=JakeRoxs_server_9178fbff-b3bf-4c2c-9c34-efc7eb852932
            -Dsonar.projectName=rekindled-server
            -Dsonar.sources=Source/Server,Source/Server.DarkSouls2,Source/Server.DarkSouls3,Source/Shared,Source/Injector
            -Dsonar.exclusions=**/Protobuf/Generated/**,**/*.pb.cc,**/*.pb.h
            -Dsonar.cfamily.compile-commands=intermediate/cmake/linux-debug/compile_commands.json
            -Dsonar.cxx.cobertura.reportPaths=intermediate/cmake/linux-debug/cpp-cobertura.xml
            -Dsonar.cfamily.threads=4
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.verbose=true

  sonar-hub:
    name: SonarQube Hub (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - name: Validate SonarQube settings
        shell: bash
        run: |
          [[ -n "$SONAR_TOKEN" ]] || { echo "SONAR_TOKEN is not set"; exit 1; }
          [[ -n "$SONAR_HOST_URL" ]] || { echo "SONAR_HOST_URL is not set"; exit 1; }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-hub-${{ hashFiles('Source/hub/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-hub-

      - name: Cache SonarQube scanner plugins
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-plugin-cache-hub-${{ runner.os }}-v1
          restore-keys: |
            sonar-plugin-cache-hub-${{ runner.os }}-

      - name: Install hub dependencies
        working-directory: Source/hub
        run: npm ci

      - name: Run hub tests with coverage
        shell: bash
        working-directory: Source/hub
        run: npx c8 --reporter=lcov --reports-dir ../../TestResults/hub node --test ./src/test/servers.test.js

      - uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.projectKey=Rekindled-Server-Hub
            -Dsonar.projectName=rekindled-server-hub
            -Dsonar.sources=Source/hub/src
            -Dsonar.exclusions=**/node_modules/**
            -Dsonar.javascript.lcov.reportPaths=TestResults/hub/lcov.info
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=true
            -Dsonar.verbose=true
