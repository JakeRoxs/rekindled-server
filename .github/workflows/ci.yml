name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Trigger SonarQube workflow
    # SonarQube already handles pushes and PRs targeting main itself.
    # Dispatch only repository refs; fork and Dependabot PRs have read-only tokens.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
      (github.event_name == 'pull_request' &&
       github.base_ref == 'development' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch SonarQube analysis
        uses: actions/github-script@v9
        with:
          script: |
            const ref = context.payload.pull_request?.head.ref
              ?? context.ref.replace(/^refs\/(heads|tags)\//, '');
            core.info(`Dispatching sonarqube.yml on ref: ${ref}`);
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'sonarqube.yml',
              ref,
              inputs: { branch: ref }
            });

  # Always validate the current revision. A docs-only follow-up must not replace
  # a failed or cancelled build with a successful skipped matrix.
  build:
    name: Build (matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-release
          - os: ubuntu-latest
            preset: linux-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build and test
        uses: ./.github/actions/build
        with:
          preset: ${{ matrix.preset }}
