name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        default: "0.0.1"
      version_postfix:
        description: "Version Postfix"
        required: true
        default: "-preview"

permissions:
  contents: read

env:
  # Version number being built.
  VERSION_NUMBER_POSTFIX: ${{ github.event.inputs.version_postfix }}

  # Version number being built.
  VERSION_NUMBER: ${{ github.event.inputs.version }}

jobs:
  build:
    name: Build (matrix)
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-release
            platform: windows
          - os: ubuntu-latest
            preset: linux-release
            platform: linux
    env:
      NATIVE_OUTPUT_ROOT: intermediate/cmake/${{ matrix.preset }}/bin/Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build and test
        uses: ./.github/actions/build
        with:
          preset: ${{ matrix.preset }}

      - name: Package Release (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PACKAGE_BUILD_CONFIGURATION: Release
          PACKAGE_PLATFORM: x64
          LOADER_WINDOWS_RUNTIME: win-x64
        run: |
          cd "${{ github.workspace }}"
          ./Tools/generate_package_windows.bat

      - name: Package Release (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PACKAGE_BUILD_CONFIGURATION: Release
          PACKAGE_PLATFORM: x64
          LOADER_AVALONIA_LINUX_RUNTIME: linux-x64
        run: |
          cd "${{ github.workspace }}"
          "${{ github.workspace }}/Tools/generate_package_linux.sh"

      - name: Verify packaged files
        shell: bash
        run: |
          echo "Packaged contents for ${GITHUB_RUN_ID} on ${{ matrix.platform }}"
          cd "${{ github.workspace }}/rekindled-server"
          find . | sort

      - name: Zip Release
        uses: vimtor/action-zip@5f1c4aa587ea41db1110df6a99981dbe19cee310 # v1
        with:
          files: rekindled-server/
          dest: ${{ matrix.platform }}-${{ env.VERSION_NUMBER }}${{ env.VERSION_NUMBER_POSTFIX }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.platform }}-${{ env.VERSION_NUMBER }}${{ env.VERSION_NUMBER_POSTFIX }}.zip
          name: ${{ matrix.platform }}

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        image:
          - context: ./Source/hub
            file: ./Source/hub/Dockerfile
            tag: rekindled-hub:latest
          - context: .
            file: ./DarkSouls3.Dockerfile
            tag: rekindled-ds3-server:latest
          - context: .
            file: ./DarkSouls2.Dockerfile
            tag: rekindled-ds2s-server:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Login to DockerHub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build and push ${{ matrix.image.tag }}
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  make-release:
    name: Make Release
    needs: [build, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download windows artifact
        id: download-windows-artifact
        uses: actions/download-artifact@v8
        with:
          name: windows

      - name: Download linux artifact
        id: download-linux-artifact
        uses: actions/download-artifact@v8
        with:
          name: linux

      - name: Display artifacts
        run: ls -R

      - name: Publish release via GitHub CLI
        env:
          VERSION_TAG: v${{ env.VERSION_NUMBER }}${{ env.VERSION_NUMBER_POSTFIX }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Release $VERSION_TAG already exists, will upload assets."
          else
            gh release create "$VERSION_TAG" \
              --title "Release $VERSION_TAG" \
              --notes "Preview build" \
              --draft=false --prerelease=true
          fi
          gh release upload "$VERSION_TAG" \
            windows-${{ env.VERSION_NUMBER }}${{ env.VERSION_NUMBER_POSTFIX }}.zip \
            linux-${{ env.VERSION_NUMBER }}${{ env.VERSION_NUMBER_POSTFIX }}.zip
