name: Build MS Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docker:
    name: Build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout respository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push hub-server docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./Source/hub/
          file: ./Source/hub/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rekindled-hub:latest
